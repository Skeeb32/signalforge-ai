[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge-ai"
version = "0.1.0"
description = "A reproducible customer churn ML lifecycle platform"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "torch", "mlflow", "shap", "fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "alembic", "redis", "celery", "python-multipart", "prometheus-client", "matplotlib", "scipy", "httpx", "psutil"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pillow"]

[project.scripts]
signalforge = "signalforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external PostgreSQL or Redis"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
